[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[FILTER]
    # Filter to only process lines containing NeuroGuard JSON structure
    Name   grep
    Match  envoy.logs
    Regex  log \{.*"attack_type".*\}

[FILTER]
    # Extract the JSON payload from the Envoy log string
    # Envoy logs often look like: [error] [wasm] ... {"timestamp":...}
    Name   parser
    Match  envoy.logs
    Key_Name log
    Parser envoy_wasm_json
    Preserve_Key False
    Reserve_Data True

[OUTPUT]
    Name        http
    Match       envoy.logs
    Host        clickhouse
    Port        8123
    URI         /?query=INSERT+INTO+neuroguard.waf_logs+FORMAT+JSONEachRow
    Format      json_stream
    HTTP_User   admin
    HTTP_Passwd neuroguard_secure_pwd
