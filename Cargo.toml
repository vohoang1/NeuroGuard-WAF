[package]
name        = "neuroguard-waf"
version     = "0.1.0"
edition     = "2021"
description = "NeuroGuard WAF – AI-augmented Wasm filter for Envoy Proxy"
authors     = ["NeuroGuard Security Team"]

# ── Output targets ────────────────────────────────────────────────────────────
# cdylib  → produces the .wasm binary that Envoy loads via its Wasm runtime.
# rlib    → allows `cargo test` to link crate internals for unit/integration
#           tests without a Wasm target.
[lib]
name       = "neuroguard_waf"
crate-type = ["cdylib", "rlib"]

# ── Runtime dependencies ──────────────────────────────────────────────────────
[dependencies]

# proxy-wasm: Official Rust ABI bindings for Envoy's Wasm filter SDK.
# Provides RootContext / HttpContext traits and all host-call wrappers.
proxy-wasm = "0.2"

# serde + serde_json: Config deserialisation (on_vm_start) and structured
# JSON audit log serialisation for SIEM ingestion.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# log: Thin logging facade; proxy-wasm bridges log::* macros to Envoy's
# internal logger so events appear in Envoy's error/access log stream.
log = "0.4"

# regex-lite: Lighter regex engine – smaller Wasm binary size vs full `regex`.
# Compiled patterns are stored in root-context instance fields so they are
# built ONCE per Wasm VM, never per request.
regex-lite = "0.1"

# once_cell: Lazy / OnceCell primitives for any truly global static state.
# Prefer root-context instance storage (see root_context.rs) but once_cell
# is kept for shared immutable data that never changes after VM start.
once_cell = "1"

# ── Dev / test dependencies ───────────────────────────────────────────────────
[dev-dependencies]
serde_json = "1"   # re-listed explicitly for test helpers

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
opt-level     = "z"   # size-optimise (Envoy default Wasm limit: 3 MB)
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"   # no unwinding runtime in Wasm

[profile.dev]
opt-level = 0
debug     = true